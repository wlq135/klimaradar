services:
  - type: web
    name: klimaradar
    runtime: docker
    repo: https://github.com/wlq135/klimaradar
    plan: starter
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/klimaradar.db
      - key: BASE_URL
        value: https://klima-radar.com
      - key: DEBUG
        value: "false"
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: alerts@klima-radar.com
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ENABLE_DEMO
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENABLE_SCRAPER
        value: "false"
      - key: AMAZON_DE_AFFILIATE_TAG
        value: "klrmrd-21"
      - key: AMAZON_UK_AFFILIATE_TAG
        value: "klrmrd05-21"
      - key: AMAZON_FR_AFFILIATE_TAG
        value: "klrmrd-21"
      - key: AMAZON_IT_AFFILIATE_TAG
        value: "klrmrd02-21"
      - key: AMAZON_ES_AFFILIATE_TAG
        value: "klrmrd03-21"
      - key: AMAZON_NL_AFFILIATE_TAG
        value: "klrmrd-21"
      - key: AMAZON_BE_AFFILIATE_TAG
        value: "klrmrd-21"
      - key: MEDIAMARKT_DE_AFFILIATE_TAG
        sync: false
      - key: BOULANGER_FR_AFFILIATE_TAG
        sync: false
      - key: DARTY_FR_AFFILIATE_TAG
        sync: false
      - key: PLAUSIBLE_DOMAIN
        value: ""
      - key: PLAUSIBLE_SCRIPT_URL
        value: "https://plausible.io/js/script.js"
      - key: CF_WEB_ANALYTICS_TOKEN
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: PLAYWRIGHT_PROXY_SERVER
        sync: false
      - key: PLAYWRIGHT_PROXY_USERNAME
        sync: false
      - key: PLAYWRIGHT_PROXY_PASSWORD
        sync: false
      - key: PLAYWRIGHT_PROXY_RETAILERS
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_VARIANT_ID
        sync: false
      - key: CREEM_API_KEY
        sync: false
      - key: CREEM_WEBHOOK_SECRET
        sync: false
      - key: CREEM_PRODUCT_ID
        sync: false
      - key: CREEM_API_BASE
        value: "https://api.creem.io/v1"
    healthCheckPath: /api/health
    disk:
      name: klimaradar-data
      mountPath: /data
      sizeGB: 1
  - type: worker
    name: klimaradar-scraper
    runtime: docker
    repo: https://github.com/wlq135/klimaradar
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: ENABLE_SCRAPER
        value: "false"
      - key: WORKER_API_BASE
        value: https://klima-radar.com
      - key: WORKER_API_KEY
        sync: false
      - key: WORKER_COUNTRY
        value: ""
      - key: SCRAPER_INTERVAL_MINUTES
        value: "10"
      - key: WORKER_RESTART_CYCLES
        value: "1"
      - key: WORKER_ISOLATED_SPIDERS
        value: "true"
      - key: SPIDER_QUERIES_PER_BROWSER
        value: "1"
      - key: PLAYWRIGHT_PROXY_SERVER
        sync: false
      - key: PLAYWRIGHT_PROXY_USERNAME
        sync: false
      - key: PLAYWRIGHT_PROXY_PASSWORD
        sync: false
      - key: PLAYWRIGHT_PROXY_RETAILERS
        sync: false
